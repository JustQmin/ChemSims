# Baut bei jedem Push den Katalog (katalog.json) neu und veröffentlicht die Seite auf GitHub Pages.
# Einmalig nötig: Settings → Pages → Build and deployment → Source: "GitHub Actions".

name: Seite veröffentlichen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # vollständige Historie, damit das Datum je Material stimmt

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Katalog erzeugen
        run: node scripts/build-katalog.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

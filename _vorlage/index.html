<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Titel: erscheint als Überschrift der Karte auf der Startseite -->
  <title>Daniell-Element</title>

  <!-- Ein bis zwei Sätze: Worum geht es? Wird auf der Karte angezeigt und durchsucht. -->
  <meta name="description" content="Elektronen fließen durch den Draht, nicht durch die Lösung: Vorgänge auf Teilchenebene in beiden Halbzellen.">

  <!-- Art des Materials, frei wählbar. Gleiche Schreibweise = gleicher Filter.
       Bisher: Vorführung, Schülertool, Spiel, Lernpfad -->
  <meta name="material:typ" content="Vorführung">

  <!-- Klassenstufen: einzelne Werte, Bereiche oder Kursstufe, durch Komma getrennt.
       Beispiele: "9"  |  "8, 9"  |  "8-10"  |  "J1, J2" -->
  <meta name="material:klasse" content="J1, J2">

  <!-- Geräte, für die das Material gedacht ist -->
  <meta name="material:geraet" content="Beamer, PC">

  <!-- Zusätzliche Suchbegriffe, die nicht im Titel stehen (Synonyme, Fachbegriffe) -->
  <meta name="material:stichworte" content="Elektrochemie, Redox, galvanische Zelle, Halbzelle">

  <!-- Optional:
  <meta name="material:reihenfolge" content="1">      kleinere Zahl = weiter vorne im Bereich
  <meta name="material:vorschau" content="bild.png">  sonst wird vorschau.png/.jpg/.webp im Ordner genutzt
  <meta name="material:katalog" content="nein">       nicht auf der Startseite anzeigen
  -->
</head>
<body>
  <p>Vorlage: Ordner kopieren, umbenennen und in den passenden Fach-/Bereichsordner legen.
     Ordner, die mit „_“ beginnen, erscheinen nicht auf der Startseite.</p>
</body>
</html>

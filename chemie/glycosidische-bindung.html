<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Lernpfad zum Mechanismus der sauren Hydrolyse von Saccharose (Chemie J1 Leistungsfach).">
<meta name="material:katalog" content="nein">
<title>Mechanismus Saccharose-Hydrolyse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: Lernpfad – Kopf mit Fortschritt, links Molekülbühne (Haworth, 3D auf Knopfdruck), rechts eine Aufgabenkarte; Glossar als eigene Seite */
:root{
  --bg:#f5f4ef; --panel:#ffffff; --ink:#1c2230; --muted:#5d6676; --line:#d8dbe2; --soft:#eef0f3;
  --react:#D55E00; --up:#E69F00; --upText:#a86f00; --down:#0072B2;
  --good:#1a7f4b; --bad:#b3261e; --hi:rgba(0,114,178,.13); --onInk:#ffffff;
  --unitA:0,158,115; --unitB:204,121,167; --unitOp:0.2;
  --font:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14161b; --panel:#1d2027; --ink:#e7e9ef; --muted:#a3abba; --line:#353a46; --soft:#262a33;
  --react:#F08A4B; --up:#F0B429; --upText:#F0B429; --down:#56B4E9;
  --good:#4cc38a; --bad:#ff8a80; --hi:rgba(86,180,233,.2); --onInk:#14161b;
  --unitA:43,196,154; --unitB:227,155,196; --unitOp:0.16; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#14161b; --panel:#1d2027; --ink:#e7e9ef; --muted:#a3abba; --line:#353a46; --soft:#262a33;
  --react:#F08A4B; --up:#F0B429; --upText:#F0B429; --down:#56B4E9;
  --good:#4cc38a; --bad:#ff8a80; --hi:rgba(86,180,233,.2); --onInk:#14161b;
  --unitA:43,196,154; --unitB:227,155,196; --unitOp:0.16; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5}
body{margin:0}
.wrap{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));max-width:1280px;margin:0 auto}
header.top{background:var(--panel);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px}
header.top .ttl{flex:1 1 auto;min-width:0}
header.top .kick{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
header.top h1{margin:0;font-size:1.4rem;line-height:1.2;text-wrap:balance}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--down);outline-offset:2px}
.btn{font:inherit;font-size:.95rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;border-radius:9px;cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--ink);color:var(--onInk);border-color:var(--ink)}
.btn.small{font-size:.86rem;padding:6px 11px;min-height:38px}
.btn[aria-pressed="true"]{background:var(--soft);border-color:var(--ink)}
/* Fortschritt */
.prog{display:flex;gap:6px;flex-wrap:wrap;padding-block:10px 4px}
.chip{font:inherit;font-size:.84rem;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:5px 12px;min-height:34px;cursor:pointer}
.chip:disabled{cursor:default}
.chip.done{color:var(--ink);background:var(--soft)}
.chip.done span::after{content:" ✓";color:var(--good)}
.chip.cur{background:var(--ink);color:var(--onInk);border-color:var(--ink);font-weight:700;opacity:1}
.chip:not(.done):not(.cur):disabled{opacity:.6}
/* Hauptbereich */
.app{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,1fr);gap:16px;align-items:start;padding-block:10px 40px}
.stagewrap{position:sticky;top:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stbar{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.stbar .stlab{font-weight:700;font-size:.85rem;color:var(--muted);padding-left:4px}
.stbar .sp{flex:1}
.stbody{display:grid}
.hw{position:relative}
.hw svg{display:block;width:100%;height:auto;aspect-ratio:740/360;font-family:var(--font);touch-action:manipulation}
.hw svg.pick{cursor:pointer}
.modehint{position:absolute;left:10px;bottom:6px;font-size:.8rem;color:var(--down);font-weight:700;pointer-events:none}
.d3{position:relative;border-top:1px solid var(--line);height:clamp(260px,34vw,420px)}
.d3 canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.d3tools{position:absolute;right:6px;top:6px}
.d3hint{position:absolute;left:10px;bottom:6px;font-size:.74rem;color:var(--muted);pointer-events:none}
.cardwrap{display:grid;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px 18px}
.card .intro{margin:0 0 12px;padding:8px 12px;border-left:4px solid var(--down);background:var(--soft);border-radius:0 8px 8px 0;font-size:.95rem}
.chead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cno{font-weight:700;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;background:var(--ink);color:var(--onInk);border-radius:6px;padding:2px 8px}
.ctype{font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.ctype.rev{color:var(--down);border-color:var(--down)}
.card h2{margin:8px 0 6px;font-size:1.22rem;line-height:1.25;text-wrap:balance}
.card .q{margin:0 0 12px}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 14px;min-height:48px;cursor:pointer;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt[aria-checked="true"]{border-color:var(--down);background:var(--hi);box-shadow:inset 0 0 0 1px var(--down)}
.opt.wrong{text-decoration:line-through;text-decoration-color:var(--bad);opacity:.55}
.opt.right{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good);opacity:1}
.opt:disabled{cursor:default}
.opts.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.tiles .opt{text-align:center;font-size:1.25rem;min-height:64px}
.fb{margin-top:12px;font-size:.98rem;border-radius:9px}
.fb:empty{display:none}
.fb.ok{background:color-mix(in srgb,var(--good) 12%,var(--panel));border-left:4px solid var(--good);padding:8px 12px}
.fb.no,.fb.part{background:color-mix(in srgb,var(--react) 10%,var(--panel));border-left:4px solid var(--react);padding:8px 12px}
.fb.info{color:var(--muted);padding:2px 0}
.genauer{display:block;margin-top:4px;color:var(--muted);font-size:.92rem}
.tipbox .tip{margin:10px 0 0;padding:8px 12px;border:1px dashed var(--down);border-radius:9px;font-size:.95rem}
.tipbox .tip b{color:var(--down)}
.cact{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.acnt{margin:0 0 4px}
.afterbox{margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
.afterbox p{margin:0 0 8px}
.small{font-size:.86rem;color:var(--muted)}
.slots{margin:0 0 10px;padding-left:1.6em;display:grid;gap:6px}
.slots .empty{display:block;border:1.5px dashed var(--line);border-radius:10px;min-height:48px}
.ord.pool{display:grid;gap:6px}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:8px 12px;align-items:center}
select{font:inherit;font-size:.95rem;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-height:44px;width:100%}
.vorlage{margin:0 0 8px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px;max-height:420px;overflow:auto}
.vorlage img{display:block;width:100%;height:auto;-webkit-touch-callout:default}
.vorlagebox .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.checkl{margin-top:14px}
.check{display:grid;gap:6px;margin:6px 0;padding:0;list-style:none}
.check label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--good);flex:none}
.review{list-style:none;margin:8px 0;padding:0;display:grid;gap:6px}
.rv{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.rvs{text-align:center;line-height:0}
i.dot{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:-1px;border:2px solid}
i.dot.sicher{background:var(--good);border-color:var(--good)}
i.dot.hilfe{border-color:var(--down);background:linear-gradient(90deg,var(--down) 50%,transparent 50%)}
i.dot.unsicher{border-color:var(--react)}
.rvb{grid-column:2;display:flex;gap:6px;flex-wrap:wrap}
.hist{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.hist>summary{cursor:pointer;font-weight:700;color:var(--muted);min-height:32px;display:flex;align-items:center}
.hist .hl{display:grid;gap:4px;margin-top:6px}
.hist .hl details{border-top:1px solid var(--line);padding:6px 0}
.hist .hl summary{cursor:pointer;font-size:.92rem}
.hist .hl p{margin:6px 0 0;font-size:.92rem}
.hist .hfb{color:var(--muted)}
.hid{font-weight:700;margin-right:4px}
.hst{font-size:.8rem;margin-left:6px;color:var(--good)} .hst.unsicher{color:var(--react)} .hst.hilfe{color:var(--down)}
.chip.reach{color:var(--ink)}
.wfig{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:4px}
.wfig svg{display:block;width:100%;height:auto}
.infotext p{margin:0 0 10px}
.infotext .eq,.eq{font-size:1.08rem;text-align:center;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--soft)}
.steps{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:5px}
.stepbtn{font:inherit;font-size:.92rem;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:9px;padding:7px 12px;min-height:40px;cursor:pointer}
.stepbtn.done{color:var(--ink)}
.stepbtn.cur{border-color:var(--react);color:var(--ink);font-weight:700;box-shadow:inset 4px 0 0 var(--react)}
.steptext{padding:10px 12px;border-left:4px solid var(--react);background:var(--soft);border-radius:0 9px 9px 0;margin-bottom:10px;min-height:4.5em}
.pctl{margin-top:4px}
.task{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px}
.task h3{margin:0 0 6px;font-size:1.08rem}
.task p{margin:0 0 10px}
.tout{margin-top:10px}
.tip{margin:0;padding:8px 12px;border:1px dashed var(--down);border-radius:9px;font-size:.95rem}
.solwrap{margin-top:14px}
.sol{margin-top:10px}
.vorlage{cursor:zoom-in}
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.82);display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
.lbbar{display:flex;align-items:center;gap:10px;justify-content:space-between;color:#fff;margin-bottom:8px}
.lbimg{flex:1;overflow:auto;background:#fff;border-radius:10px;-webkit-overflow-scrolling:touch}
.lbimg img{display:block;width:100%;min-width:640px;height:auto}
a.gl{color:inherit;text-decoration:underline dotted var(--muted);text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:pointer}
a.gl:hover{color:var(--down)}
/* Glossar-Seite */
.gpage{padding-block:14px 48px}
.ghead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.ghead h2{margin:0;font-size:1.35rem}
#gidx{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
#gidx a{font-size:.86rem;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 11px;background:var(--panel)}
#glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:12px}
.gle{display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr);gap:14px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;scroll-margin-top:12px;transition:background .8s}
.gle:not(:has(.gfig)){grid-template-columns:1fr}
.gle.flash{background:var(--hi)}
.gfig svg{display:block;width:100%;height:auto}
.gle h3{margin:0 0 4px;font-size:1.08rem}
.gle p{margin:0 0 6px;font-size:.96rem}
.gle .gex{color:var(--muted);font-size:.92rem}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .stagewrap{position:relative;top:0}
  .d3{height:clamp(260px,46vw,420px)}
}
@media (max-width:560px){
  .gle{grid-template-columns:1fr} .gfig{max-width:320px}
  .opts.tiles{grid-template-columns:1fr 1fr}
  .match{grid-template-columns:1fr}
  .card{padding:14px 12px}
  header.top h1{font-size:1.2rem}
}
</style>
</head>

<header class="top"><div class="wrap">
  <div class="ttl"><div class="kick">Lernpfad · Kohlenhydrate</div><h1>Wie spaltet Säure die glycosidische Bindung?</h1></div>
  <button class="btn" type="button" id="gbtn" aria-pressed="false">Glossar</button>
</div><div class="wrap"><nav class="prog" id="prog" aria-label="Fortschritt"></nav></div></header>
<main class="wrap app" id="app">
  <section class="stagewrap" id="stage" aria-label="Molekülbühne"></section>
  <section class="cardwrap"><div class="card" id="card" aria-live="polite"></div></section>
</main>
<main class="wrap gpage" id="gloss" hidden>
  <div class="ghead"><button class="btn" type="button" id="gback">← zurück zur Aufgabe</button><h2>Glossar</h2></div>
  <nav id="gidx" aria-label="Begriffe"></nav>
  <div id="glist"></div>
</main>

/* Mechanismus-Konfiguration: Ring L behält das Brücken-O, Ring C wird zum Carbokation */

/* Posen beider Ringe so bestimmen, dass anomeres C und Partner-C auf gleicher Höhe liegen */
function cfgPoses(cfg,fl=1,shift=0){
  const sg=cfg.sigma;

    const PL0=pose(cfg.L.cx,cfg.L.cy), Cl=ringVertex(cfg.L.sug,cfg.L.C,PL0);
    const Mf=cfg.C.flipped?Rz(Math.PI):I3, t0=ringVertex(cfg.C.sug,cfg.C.C,pose(0,0,Mf));
    const fcx=Cl.x+cfg.gap-t0.x, fcy=Cl.y-t0.y;

    const PC=cfg.C.flipped? pose(lerp(cfg.C.preCx,fcx,fl), fcy, Rz(Math.PI*fl)) : PCf;
    return {PL:pose(cfg.L.cx+shift,cfg.L.cy), PC, PCf, PL0};

    const PCf=pose(cfg.C.cx,cfg.C.cy), Cc=ringVertex(cfg.C.sug,cfg.C.C,PCf);

function mechH(key,k,o={}){

  addRing(F,cfg.C.id,cfg.C.sug,PC,{omit:[cfg.C.C+'.'+cfg.C.sl],tint:cfg.C.tint});

/* Mechanismus-Pfeile je Schritt; Hydrolyse: Schritt s führt von Zustand s-1 nach s */
function mechArrows(step,dir='h'){
  if(dir==='h') return [null,
    [{s:{kind:'lp',id:'lp:Ob:*'},t:{id:'Hp'}},{s:{kind:'bond',id:bkey('Oa','Hp')},t:{id:'Oa'}}],
    [{s:{kind:'bond',id:'@CO'},t:{id:'Ob'}}],
    [{s:{kind:'lp',id:'lp:Ow:*'},t:{id:'@C'}}],
    [{s:{kind:'lp',id:'lp:Oa:*'},t:{id:'Hw2'}},{s:{kind:'bond',id:bkey('Ow','Hw2')},t:{id:'Ow'}}]][step];
  // Bildung (Kondensation): Schritt 1 = 4→3, 2 = 3→2, 3 = 2→1, 4 = 1→0
  return [null,
    [{s:{kind:'lp',id:'lp:Ow:*'},t:{id:'Hw2'}},{s:{kind:'bond',id:bkey('Oa','Hw2')},t:{id:'Oa'}}],
    [{s:{kind:'bond',id:'@COw'},t:{id:'Ow'}}],
    [{s:{kind:'lp',id:'lp:Ob:*'},t:{id:'@C'}}],
    [{s:{kind:'lp',id:'lp:Oa:*'},t:{id:'Hp'}},{s:{kind:'bond',id:bkey('Ob','Hp')},t:{id:'Ob'}}]][step];
}
function resolveArrows(m,arrs){ const c=MC[m], Ca=c.C.id+'.'+c.C.C;
  return (arrs||[]).map(a=>{ const s={...a.s}, t={...a.t};
    if(s.id==='@CO') s.id=bkey('Ob',Ca); if(s.id==='@COw') s.id=bkey('Ow',Ca); if(t.id==='@C') t.id=Ca; return {...a,s,t}; }); }

/* ---------- Bühne (Haworth + 3D auf Knopfdruck) ---------- */
function Stage(host){
  host.innerHTML=`<div class="stbar"><span class="stlab">Haworth-Projektion</span><span class="sp"></span>
      <button class="btn small" type="button" data-replay hidden>↻ Animation</button>
      <button class="btn small" type="button" data-num aria-pressed="true">C-Nummern</button>
      <button class="btn small" type="button" data-3d aria-pressed="false">3D-Modell</button></div>
    <div class="stbody"><div class="hw"><svg preserveAspectRatio="xMidYMid meet" role="img" aria-label="Haworth-Projektion"></svg><div class="modehint" aria-live="polite"></div></div>
      <div class="d3" hidden><canvas aria-label="Kugel-Stab-Modell"></canvas><div class="d3tools"><button class="btn small" type="button" data-rs>Blick ↺</button></div><div class="d3hint">Ziehen: drehen · zwei Finger: zoomen</div></div></div>`;
  const svg=$('svg',host), V=makeV3($('canvas',host),$('[data-rs]',host)), d3box=$('.d3',host), hint=$('.modehint',host), b3=$('[data-3d]',host);
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const MECH=d3mech('suc',[0,1,2,3,4]), FLIP=d3mech('suc',['pre',4,0]);
  let frame=null, anim=null, d3t={seq:MECH,t:0}, onPick=null, mode=null, overlay={}, token=0, want3d=false;
  const S={num:true};
  function cur3(){ if(!frame||frame.m!=='suc') return; const m=d3t.seq.at(d3t.t); if(m.fit) V.setFit(m.fit[0],m.fit[1]*0.8); V.set(m); }
  function draw(){ const F=frame; if(!F) return; svg.setAttribute('viewBox',F.vb); const vb=F.vb.split(' ').map(Number); svg.style.aspectRatio=vb[2]+'/'+vb[3];
    svg.innerHTML=renderFrame(F,PAL,{mid:'r',ud:false,num:S.num})+overlaySVG(F,overlay,PAL,'s');
    if(!d3box.hidden) cur3(); }
  function frameOf(c){ const m=c.m||'suc'; vbOf(m); if(c.flip!=null) return flipFrame(c.flip); return mFrame(m,c.k,c); }
  function show3d(){ const can=(frame&&frame.m==='suc'); b3.hidden=!can; const on=can&&want3d; d3box.hidden=!on; b3.setAttribute('aria-pressed',on); if(on){ V.resize(); cur3(); } }
  S.set=(c,ov={})=>{ token++; cancelAnimationFrame(anim); frame=frameOf(c); overlay=ov; d3t=c.flip!=null?{seq:FLIP,t:c.flip}:{seq:MECH,t:c.k??0}; show3d(); draw(); };
  S.overlay=ov=>{ overlay=ov; draw(); };
  S.frame=()=>frame;
  S.busy=()=>!!S._busy;
  const wait=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));
  /* Übergang: Pfeile kurz zeigen, dann langsame Bewegung */
  S.play=(a,b,o={})=>new Promise(res=>{
    const my=++token; cancelAnimationFrame(anim); const FA=frameOf(a), FB=frameOf(b), ov0=o.overlay||{};
    const seq=o.seq||MECH, t0=o.t0??(a.k??0), t1=o.t1??(b.k??0), hold=o.hold??900, dur=reduce?1:(o.dur||3600);
    const done=()=>{ S._busy=false; res(); };
    S._busy=true;
    const run=async()=>{ frame=FA; overlay=ov0; draw(); await wait(hold); if(my!==token) return done();
      const start=performance.now();
      const step=now=>{ if(my!==token) return done(); const u=clamp((now-start)/dur,0,1);
        frame=o.trans? o.trans(ss(u)) : mix(FA,FB,ss(u)); frame.m=FA.m;
        const fa=1-ss(u/0.3);
        overlay={arrows:(ov0.arrows||[]).map(x=>({...x,op:fa})), charges:(ov0.charges||[]).map(c=>({...c,op:fa})), lps:ov0.lps};
        if(FA.m==='suc') d3t={seq, t:lerp(t0,t1,ss(u))}; draw();
        if(u<1) anim=requestAnimationFrame(step); else { frame=FB; overlay=o.end||{}; d3t={seq, t:t1}; draw(); done(); } };
      anim=requestAnimationFrame(step); };
    if(!d3box.hidden) V.align(run); else run();
  });
  S.flipDemo=async()=>{ const a={flip:0}, b={flip:1}; S.set(a); const my=token;
    await S.play(a,b,{trans:f=>flipFrame(f),seq:FLIP,t0:0,t1:1,dur:4200,hold:700}); if(token!==my+1) return;
    await S.play(b,{k:0,acid:false},{seq:FLIP,t0:1,t1:2,dur:1800,hold:500}); };
  S.listen=(kinds,cb,o={})=>{ mode={kinds:new Set(kinds),lpIds:o.lpIds}; onPick=cb; svg.classList.add('pick'); hint.textContent=o.hint||''; };
  S.stop=()=>{ mode=null; onPick=null; svg.classList.remove('pick'); hint.textContent=''; };
  svg.addEventListener('click',e=>{ if(!mode||!onPick||S._busy) return; const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
    const m=svg.getScreenCTM(); if(!m) return; const p=pt.matrixTransform(m.inverse()); onPick(hitTest(frame,p,mode.kinds,mode.lpIds)); });
  b3.onclick=()=>{ want3d=!want3d; show3d(); };
  const bn=$('[data-num]',host); bn.onclick=()=>{ S.num=!S.num; SET.num=S.num; bn.setAttribute('aria-pressed',S.num); draw(); if(!d3box.hidden) cur3(); };
  const rp=$('[data-replay]',host); S.setReplay=fn=>{ rp.hidden=!fn; rp.onclick=fn||null; };
  S.redraw=draw;
  return S;
}

const GL=[
 ['abgang','Abgangsgruppe','Abgangsgruppe[n]?','Atom oder Atomgruppe, die bei einer Reaktion zusammen mit dem bindenden Elektronenpaar vom Molekül abgespalten wird. Gute Abgangsgruppen sind stabile, neutrale Moleküle wie Wasser oder ein Alkohol. Starke Basen wie Hydroxid- oder Alkoholat-Ionen sind schlechte Abgangsgruppen.','Hier: Nach der Protonierung wird der Glucose-Baustein als neutrales Molekül abgespalten.','abgang'],
 ['anomer','Anomeres Kohlenstoffatom','anomere[nmrs]? Kohlenstoffatom[s]?|Anomer(?:e|en)?','Das Kohlenstoffatom, das beim Ringschluss aus dem Kohlenstoffatom der Carbonylgruppe entsteht. Es ist als einziges Kohlenstoffatom an zwei Sauerstoffatome gebunden: an das Ring-Sauerstoffatom und an das Sauerstoffatom einer Hydroxygruppe bzw. einer glycosidischen Bindung. Die beiden möglichen Anordnungen heißen α- und β-Anomer.','Glucose: C1-Atom, Fructose: C2-Atom. In Saccharose sind beide anomeren Kohlenstoffatome über das verbrückende Sauerstoffatom verknüpft.','anomer'],
 ['bronsted','Säure und Base (nach Brønsted)','Protonendonator|Protonenakzeptor|Base(?=[ .,)])','Eine Säure gibt Protonen (H⁺) ab (Protonendonator), eine Base nimmt Protonen auf (Protonenakzeptor). Eine Base braucht dazu ein freies Elektronenpaar.','Hier: H₃O⁺ ist Protonendonator; in Schritt 4 nimmt ein Wassermolekül als Base ein Proton auf.','bronsted'],
 ['carbokation','Carbokation','Carbokation(?:en|s)?','Ion mit einem positiv geladenen Kohlenstoffatom, das nur drei Bindungspartner und damit nur ein Elektronensextett hat. Es ist trigonal-planar gebaut und reagiert als Elektrophil. Carbokationen sind umso stabiler, je mehr Alkylreste am positiv geladenen Kohlenstoffatom sitzen (tertiär > sekundär > primär); ein benachbartes Sauerstoffatom mit freiem Elektronenpaar stabilisiert zusätzlich.','Hier: Am C2-Atom des Fructose-Bausteins entsteht ein Carbokation.','carbokation'],
 ['ep','Freies Elektronenpaar','freie[snm]? Elektronenpaar(?:e|en)?','Elektronenpaar der Valenzschale, das an keiner Bindung beteiligt ist. In Strukturformeln wird es als Strich am Atom gezeichnet. Ein neutrales Sauerstoffatom mit zwei Bindungen hat zwei freie Elektronenpaare.','Mit einem freien Elektronenpaar kann ein Atom ein Proton binden oder als Nucleophil reagieren.','ep'],
 ['pfeil','Elektronenpaarpfeil','Elektronenpaarpfeil(?:e|en)?|Elektronenpaarverschiebung(?:en)?','Gebogener Pfeil in einem Reaktionsmechanismus. Er zeigt, wohin ein Elektronenpaar wandert. Er beginnt immer an einem freien Elektronenpaar oder an einer Bindung und endet dort, wo eine neue Bindung oder ein neues freies Elektronenpaar entsteht.','Ein Pfeil beginnt nie an einem Proton oder an einem positiv geladenen Atom.','pfeil'],
 ['elektrophil','Elektrophil','Elektrophil(?:e|en)?|elektrophile[nmrs]?','Teilchen mit Elektronenmangel („elektronenliebend“), das ein Elektronenpaar aufnimmt und damit eine neue Bindung bildet, z. B. ein Carbokation oder ein Proton.','Hier: Das Carbokation am C2-Atom der Fructose.','nucel'],
 ['glyc','Glycosidische Bindung','glycosidische[nmrs]? Bindung(?:en)?','Bindung zwischen dem anomeren Kohlenstoffatom eines Zuckerbausteins und einem Atom eines weiteren Moleküls, meist einem Sauerstoffatom. Sie entsteht durch Kondensation und wird durch Hydrolyse gespalten.','In Saccharose verbindet ein Sauerstoffatom das C1-Atom der Glucose mit dem C2-Atom der Fructose.','glyc'],
 ['haworth','Haworth-Projektion','Haworth-Projektion(?:en)?','Darstellung der Ringform eines Zuckers: Der Ring liegt waagrecht und wird perspektivisch von schräg oben gesehen; die dick gezeichnete Kante zeigt zum Betrachter, das Ring-Sauerstoffatom liegt hinten. Die Substituenten stehen senkrecht oberhalb oder unterhalb der Ringebene. Die Kohlenstoffatome des Rings werden nicht ausgeschrieben, sie sitzen an den Ecken.','Die Abbildung zeigt β-D-Glucose.','haworth'],
 ['hetero','Heterolytische Spaltung','heterolytisch(?:e[nmrs]?)?(?: Spaltung| gespalten)?','Spaltung einer Atombindung, bei der das bindende Elektronenpaar vollständig bei einem der beiden Atome bleibt, meist beim elektronegativeren. Es entstehen Ionen. Bei der homolytischen Spaltung erhält dagegen jedes Atom ein Elektron, und es entstehen Radikale.','Hier: Das Elektronenpaar der Bindung zwischen dem verbrückenden Sauerstoffatom und dem C2-Atom bleibt beim Sauerstoffatom, am C2-Atom entsteht ein Carbokation.','hetero'],
 ['hydro','Hydrolyse und Kondensation','Hydrolyse|hydrolysiert|Kondensation','Hydrolyse: Spaltung einer Bindung unter Aufnahme eines Wassermoleküls. Kondensation: Verknüpfung zweier Moleküle unter Abspaltung eines Wassermoleküls. Beide Reaktionen sind Umkehrungen voneinander.','Saccharose + Wasser → Glucose + Fructose ist eine Hydrolyse.','hydro'],
 ['iEff','+I-Effekt (induktiver Effekt)','\\+I-Effekt','Alkylreste schieben Elektronendichte über die Bindungen zu einem benachbarten Atom. Dadurch wird eine positive Ladung an einem Kohlenstoffatom teilweise ausgeglichen, das Carbokation wird stabilisiert.','Je mehr Alkylreste am positiv geladenen Kohlenstoffatom sitzen, desto stärker ist die Stabilisierung.','iEff'],
 ['kat','Katalysator','Katalysator(?:en|s)?','Stoff, der eine Reaktion beschleunigt, indem er einen anderen Reaktionsweg mit geringerer Aktivierungsenergie ermöglicht. Er nimmt an der Reaktion teil, wird aber am Ende zurückgebildet und taucht deshalb in der Gesamtgleichung nicht auf. Die Lage des Gleichgewichts ändert er nicht.','Hier: H₃O⁺ wird in Schritt 1 verbraucht und in Schritt 4 zurückgebildet.','kat'],
 ['mech','Reaktionsmechanismus','Reaktionsmechanismus|Mechanismus|Mechanismen','Beschreibung einer Reaktion in Einzelschritten: welche Bindungen brechen und entstehen, wohin Elektronenpaare wandern und welche Zwischenstufen auftreten. Elektronenpaarpfeile und Ladungen machen jeden Schritt sichtbar.','Saure Hydrolyse von Saccharose: Protonierung → heterolytische Spaltung → nucleophiler Angriff → Deprotonierung.',null],
 ['mesomerie','Mesomerie','Mesomerie|mesomere[nmrs]? Grenzformel(?:n)?','Lässt sich die Elektronenverteilung eines Teilchens nicht durch eine einzige Strukturformel beschreiben, zeichnet man mehrere Grenzformeln. Das tatsächliche Teilchen liegt „dazwischen“; die Ladung ist auf mehrere Atome verteilt, was das Teilchen stabilisiert.','Ein freies Elektronenpaar des Ring-Sauerstoffatoms stabilisiert das benachbarte Carbokation.','mesomerie'],
 ['nucleophil','Nucleophil, nucleophiler Angriff','Nucleophil(?:e|en)?|nucleophile[nmrs]? Angriff[s]?|nucleophile[nmrs]?','Nucleophil („kernliebend“): Teilchen mit freiem Elektronenpaar, das damit eine neue Bindung zu einem positiv geladenen oder positiv polarisierten Atom bildet, z. B. H₂O, OH⁻ oder Cl⁻. Diesen Schritt nennt man nucleophilen Angriff.','Hier: Ein Wassermolekül greift das Carbokation am C2-Atom an.','nucel'],
 ['oxonium','Oxonium-Ion','Oxonium-Ion(?:en|s)?','H₃O⁺: Ion aus einem Wassermolekül und einem Proton. Das Sauerstoffatom hat drei Bindungen und ein freies Elektronenpaar und ist deshalb positiv geladen. Oxonium-Ionen entstehen, wenn eine Säure wie HCl mit Wasser reagiert; sie bestimmen den sauren Charakter einer Lösung.','Auch ein Sauerstoffatom in einem organischen Molekül, das ein Proton aufgenommen hat (–OH₂⁺ oder R–OH⁺–R), ist ein Oxonium-Ion.','ladung'],
 ['ladung','Ladung eines Atoms bestimmen','positive[n]? Ladung|Elektronensextett','Man vergleicht die Elektronen eines Atoms in der Strukturformel mit denen des neutralen Atoms: Jedes freie Elektronenpaar zählt mit 2, jede Bindung mit 1 Elektron. Ein Sauerstoffatom ist mit 2 Bindungen und 2 freien Elektronenpaaren neutral, mit 3 Bindungen und 1 freien Elektronenpaar positiv. Ein Kohlenstoffatom mit nur 3 Bindungen und ohne freies Elektronenpaar ist positiv.','Sauerstoffatom: 6 Valenzelektronen. Mit 3 Bindungen und 1 freien Elektronenpaar sind ihm 3 + 2 = 5 Elektronen zugeordnet → Ladung +1.','ladung'],
 ['prot','Protonierung, Deprotonierung','Protonierung|Deprotonierung|protoniert(?:e[nmrs]?)?|deprotoniert(?:e[nmrs]?)?','Protonierung: Ein Teilchen nimmt ein Proton (H⁺) auf und bindet es mit einem freien Elektronenpaar. Deprotonierung: Ein Teilchen gibt ein Proton ab; das bindende Elektronenpaar bleibt zurück.','Hier: In Schritt 1 wird das verbrückende Sauerstoffatom protoniert, in Schritt 4 wird das Sauerstoffatom am C2-Atom deprotoniert.','prot']
];
let GLRX=null;
function linkify(root){
  if(!GLRX) GLRX=new RegExp('(^|[^A-Za-zÄÖÜäöüß0-9+])(?:'+GL.map(g=>'('+g[2]+')').join('|')+')','g');
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    let p=n.parentNode; while(p&&p!==root.parentNode){ if(/^(A|BUTTON|SELECT|OPTION|LABEL|SCRIPT|STYLE|TEXT|svg|SVG|H1|H2|H3|SUMMARY)$/.test(p.nodeName)||(p.classList&&['chead','nolink'].some(c=>p.classList.contains(c)))) return NodeFilter.FILTER_REJECT; p=p.parentNode; }
    GLRX.lastIndex=0; return GLRX.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT; }});
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  const self=root.dataset&&root.dataset.gl;
  nodes.forEach(n=>{ const t=n.nodeValue; let last=0, m; const frag=document.createDocumentFragment(); GLRX.lastIndex=0;
    while((m=GLRX.exec(t))){ const gi=m.slice(2).findIndex(x=>x!==undefined); const word=m[2+gi]; const start=m.index+m[1].length; const id=GL[gi][0];
      if(id===self) continue;
      frag.appendChild(document.createTextNode(t.slice(last,start)));
      const a=document.createElement('a'); a.href='#gl-'+id; a.className='gl'; a.textContent=word; frag.appendChild(a); last=start+word.length; }
    if(last===0) return; frag.appendChild(document.createTextNode(t.slice(last))); n.parentNode.replaceChild(frag,n); });
}
function buildGlossar(){
  const el=$('#glist'); const sorted=[...GL].sort((a,b)=>a[1].replace(/^\+/,'').localeCompare(b[1].replace(/^\+/,''),'de'));
  el.innerHTML=sorted.map(g=>`<article class="gle" id="gl-${g[0]}" data-gl="${g[0]}">${g[5]?`<div class="gfig">${GFIG[g[5]]()}</div>`:''}<div class="gtx"><h3>${g[1]}</h3><p>${g[3]}</p>${g[4]?`<p class="gex">${g[4]}</p>`:''}</div></article>`).join('');
  $$('.gle',el).forEach(e=>linkify(e));
  $('#gidx').innerHTML=sorted.map(g=>`<a href="#gl-${g[0]}" class="gi">${g[1]}</a>`).join('');
}

  const show=card.show||{};
  const ov=()=>{ const o={arrows:red(show.arrows||[]), lps:show.lps||lpsOf(card.stage.m)};
    if(card.kind==='tap'&&C.sel){ o.sel=[{...C.sel,c:C.done?PAL.react:PAL.down}]; if(card.preview&&C.sel.kind==='atom') o.charges=[{at:C.sel.id,sign:card.preview,col:C.done?PAL.react:PAL.down,dashed:!C.done}]; }
    if(card.kind==='arrow'){ o.lps=card.lps; o.arrows=C.arrows.map(a=>({...a,col:C.done?PAL.react:PAL.down})); if(C.pend) o.sel=[{...C.pend}]; }
    if(card.kind==='choice'&&card.chargeAt&&C.opt){ o.charges=[{at:card.chargeAt,sign:C.opt.sign,col:C.done?PAL.react:PAL.down,dashed:!C.done}]; }
    if(card.kind==='rings'){ o.sel=(C.rings||[]).map(r=>({kind:'ring',id:r})); o.labels=(C.rings||[]).map(r=>{ const c=STAGE.frame().rc[r]; return {x:c.x,y:c.y+c.s*1.62,t:card.labels[r]}; }); }
    return o; };
  C.restore=()=>STAGE.set(card.stage,ov());
  const redraw=()=>STAGE.overlay(ov());
  STAGE.set(card.stage,ov());
  STAGE.setReplay(null);
  const setFb=(t,cls)=>{ fbEl.className='fb '+cls; fbEl.innerHTML=t; linkify(fbEl); };
  const help=()=>{ const tips=card.tips||[]; bTip.hidden=C.done||C.wrong<2||C.tip>=tips.length; bRev.hidden=C.done||C.cnt<3||!card.sol&&card.kind!=='choice'&&card.kind!=='order'; };
  const lock=()=>{ $$('button.opt',body).forEach(b=>b.disabled=true); };
  const solved=()=>{ C.done=true; bCheck.hidden=true; bUndo.hidden=true; bTip.hidden=true; bRev.hidden=true; bNext.hidden=false;
    STAGE.stop(); redraw(); lock(); bNext.focus({preventScroll:true}); };
  /* Fehlversuche, die schneller als 5 s nach der letzten Prüfung kommen, zählen für die Lösung nicht mit */
  const verdict=r=>{ if(r.nocount){ setFb(r.fb,'info'); return; }
    const now=performance.now();
    if(r.ok){ setFb(r.fb,'ok'); solved(); return; }
    C.wrong++; if(now-C.last>=5000) C.cnt++; C.last=now;
    setFb(r.fb,'no'); help(); };
  bTip.onclick=()=>{ const t=card.tips[C.tip++]; $('.tipbox',el).insertAdjacentHTML('beforeend',`<p class="tip"><b>Tipp ${C.tip}:</b> ${t}</p>`); linkify($('.tipbox',el)); help(); };
  bNext.onclick=()=>advance(i);

  if(card.kind==='rings'){ C.rings=[]; bCheck.hidden=true;
    STAGE.listen(['ring'],h=>{ if(!h||C.rings.includes(h.id)) return; C.rings.push(h.id); redraw();
      if(C.rings.length===2){ body.innerHTML=`<div class="afterbox"><p>${card.after}</p><div class="wfig">${wendenFig()}</div></div>`; linkify(body);
        C.done=true; bNext.hidden=false; STAGE.stop(); } },{hint:'Markiere einen Ring.'}); }
  if(card.kind==='tap'){
    const what=card.sel.includes('bond')?'eine Bindung':'ein Atom';
    STAGE.listen(card.sel,h=>{ if(C.done||!h) return; C.sel=h; redraw(); setFb('',''); },{hint:`Markiere ${what}.`});
    bCheck.onclick=()=>{ if(!C.sel){ setFb(`Markiere zuerst ${what} in der Formel.`,'info'); return; } verdict(card.judge(C.sel,STAGE.frame())); };
    bRev.onclick=()=>{ C.sel=card.sol; const r=card.judge(card.sol,STAGE.frame()); setFb('<b>Lösung:</b> '+r.fb,'ok'); solved(); };
  }
  if(card.kind==='arrow'){ bUndo.hidden=false;
    const cnt=document.createElement('p'); cnt.className='small acnt'; body.appendChild(cnt);
    const upd=()=>{ cnt.textContent=card.n>1?`${C.arrows.length} von ${card.n} Pfeilen gesetzt.`+(C.pend?' Jetzt das Ziel markieren.':''):(C.pend?'Jetzt das Ziel markieren.':(C.arrows.length?'Pfeil gesetzt.':'Startpunkt markieren: freies Elektronenpaar oder Bindung.')); bUndo.disabled=!C.arrows.length&&!C.pend; };
    const listen=()=>STAGE.listen(C.pend?['atom','lp']:['lp','atom','bond'],pick,{lpIds:card.lps,hint:C.pend?'Ziel markieren':'Startpunkt markieren'});
    const pick=h=>{ if(C.done) return;
      if(!C.pend){ if(!h) return; if(C.arrows.length>=card.n+1){ setFb('Entferne zuerst einen Pfeil mit „Rückgängig“.','info'); return; } C.pend=h; }
      else { if(!h||h.id===C.pend.id){ C.pend=null; }
        else { const tId=h.kind==='lp'?h.at:h.id, sAt=C.pend.kind==='lp'?C.pend.at:C.pend.id;
          if(tId===sAt) C.pend=null; else { C.arrows.push({s:{kind:C.pend.kind,id:C.pend.id},t:{kind:'atom',id:tId}}); C.pend=null; } } }
      setFb('',''); redraw(); upd(); listen(); };
    listen(); upd();
    bUndo.onclick=()=>{ if(C.pend) C.pend=null; else C.arrows.pop(); redraw(); upd(); listen(); setFb('',''); };
    bCheck.onclick=()=>verdict(card.judge(C.arrows,STAGE.frame()));
    bRev.onclick=()=>{ C.arrows=red(card.sol); C.pend=null; const r=card.judge(C.arrows,STAGE.frame()); setFb('<b>Lösung:</b> '+r.fb,'ok'); solved(); upd(); };
  }
  if(card.kind==='choice'){
    const opts=shuffle(card.opts);
    body.innerHTML=`<div class="opts ${card.tiles?'tiles':''}" role="radiogroup">${opts.map((o,k)=>`<button type="button" class="opt" role="radio" aria-checked="false" data-k="${k}">${o.t}</button>`).join('')}</div>`;
    $$('.opt',body).forEach(b=>b.onclick=()=>{ if(C.done) return; C.opt=opts[+b.dataset.k]; $$('.opt',body).forEach(x=>x.setAttribute('aria-checked',x===b)); setFb('',''); redraw(); });
    bCheck.onclick=()=>{ if(!C.opt){ setFb('Wähle zuerst eine Antwort aus.','info'); return; } const o=C.opt, b=$(`.opt[data-k="${opts.indexOf(o)}"]`,body);
      if(o.ok){ b.classList.add('right'); verdict({ok:true,fb:o.fb}); } else { b.classList.add('wrong'); b.disabled=true; b.setAttribute('aria-checked','false'); C.opt=null; verdict({fb:o.fb}); redraw(); } };
    bRev.onclick=()=>{ const o=opts.find(x=>x.ok); C.opt=o; const b=$(`.opt[data-k="${opts.indexOf(o)}"]`,body); b.classList.add('right'); b.setAttribute('aria-checked','true'); setFb('<b>Lösung:</b> '+o.fb,'ok'); solved(); };
  }
  if(card.kind==='order'){
    let pool; do{ pool=shuffle(card.items.map((t,k)=>k)); }while(pool.every((v,k)=>v===k));
    const seq=[];
    const draw=()=>{ body.innerHTML=`<ol class="slots">${card.items.map((_,k)=>`<li>${seq[k]!=null?`<button type="button" class="opt placed" data-r="${k}">${card.items[seq[k]]}</button>`:'<span class="empty">…</span>'}</li>`).join('')}</ol>
        <div class="ord pool">${pool.filter(v=>!seq.includes(v)).map(v=>`<button type="button" class="opt" data-v="${v}">${card.items[v]}</button>`).join('')}</div>`;
      $$('[data-v]',body).forEach(b=>b.onclick=()=>{ if(C.done) return; seq.push(+b.dataset.v); setFb('',''); draw(); });
      $$('[data-r]',body).forEach(b=>b.onclick=()=>{ if(C.done) return; seq.splice(+b.dataset.r,1); setFb('',''); draw(); });
      if(C.done) lock(); };
    draw();
    bCheck.onclick=()=>{ if(seq.length<card.items.length){ setFb('Ordne zuerst alle vier Schritte.','info'); return; }
      const n=seq.filter((v,k)=>v===k).length; verdict(n===seq.length?{ok:true,fb:'Richtig: Protonierung, heterolytische Spaltung, nucleophiler Angriff, Deprotonierung.'}:{fb:`${n} von 4 Schritten stehen an der richtigen Stelle.`}); };
    bRev.onclick=()=>{ seq.length=0; card.items.forEach((_,k)=>seq.push(k)); C.done=true; draw(); setFb('<b>Lösung:</b> Protonierung, heterolytische Spaltung, nucleophiler Angriff, Deprotonierung.','ok'); solved(); };
  }
  if(card.kind==='info'){ bCheck.hidden=true; bNext.hidden=false; body.innerHTML=`<div class="infotext">${card.html}</div>`; linkify(body); }
  if(card.kind==='player'){ bCheck.hidden=true; bNext.hidden=false; Player(body,card.m,card.dir); }
  if(card.kind==='draw'){ bCheck.textContent='Überprüfen'; bNext.textContent='Zu den Übungsaufgaben ▶';
    body.appendChild(imgBox('Aufschrieb (Vorlage)',()=>mechSheet('suc','h',false),'Aufschrieb_Hydrolyse_Saccharose.png'));
    body.insertAdjacentHTML('beforeend',`<div class="checkl"><b>Selbst prüfen</b><ul class="check">${card.checks.map((c,k)=>`<li><label><input type="checkbox" data-ck="${k}" ${P.checks[k]?'checked':''}> <span>${c}</span></label></li>`).join('')}</ul></div><div class="sol" hidden></div>`);
    $$('[data-ck]',body).forEach(c=>c.onchange=()=>{ P.checks[c.dataset.ck]=c.checked; save(); });
    bCheck.onclick=()=>{ const s=$('.sol',body); s.innerHTML='<p><b>Musterlösung:</b> Vergleiche deine Pfeile mit der Lösung.</p>'; s.appendChild(imgBox('Musterlösung',()=>mechSheet('suc','h',true),'Musterloesung_Hydrolyse_Saccharose.png')); s.hidden=false; bCheck.hidden=true; bNext.hidden=false; s.scrollIntoView({behavior:'smooth',block:'start'}); }; }
  if(card.kind==='practice'){ bCheck.hidden=true; practice(body); }
  help(); progress();
  if(window.innerWidth<980) window.scrollTo({top:0});
}
async function advance(i){
  const card=CARDS[i]; const b=$('#card [data-next]'); if(b) b.disabled=true;
  P.cur=Math.min(i+1,CARDS.length-1); P.max=Math.max(P.max,P.cur); save(); renderCard(P.cur);
}
/* ---------- Abspieler: gesamter Mechanismus Schritt für Schritt ---------- */
function Player(host,m,dir){
  const seq=dir==='h'?[0,1,2,3,4]:[4,3,2,1,0];
  const cfg=i=>({m,k:seq[i]});
  const ovOf=i=>({arrows:i<4?resolveArrows(m,mechArrows(i+1,dir)):[], lps:lpsOf(m)});
  const names=[0,1,2,3,4].map(i=>stepText(m,dir,i).match(/<b>(.*?):?<\/b>/)[1].replace(/:$/,''));
  host.innerHTML=`<ol class="steps">${names.map((n,i)=>`<li><button type="button" class="stepbtn" data-i="${i}">${n}</button></li>`).join('')}</ol>
    <div class="steptext" aria-live="polite"></div>
    <div class="row pctl"><button class="btn" type="button" data-prev>◀ Zurück</button><button class="btn primary" type="button" data-fwd>Nächster Schritt ▶</button><button class="btn" type="button" data-all>Alles abspielen</button></div>`;
  let i=0, busy=false, stop=false;
  const ui=()=>{ $$('.stepbtn',host).forEach((b,k)=>{ b.classList.toggle('cur',k===i); b.classList.toggle('done',k<i); });
    $('.steptext',host).innerHTML=stepText(m,dir,i); linkify($('.steptext',host));
    $('[data-prev]',host).disabled=busy||i===0; $('[data-fwd]',host).disabled=busy||i===4; $('[data-all]',host).textContent=busy?'Anhalten':'Alles abspielen'; };
  const jump=k=>{ i=k; STAGE.set(cfg(i),ovOf(i)); ui(); };
  const fwd=async()=>{ if(i>=4) return; busy=true; ui(); await STAGE.play(cfg(i),cfg(i+1),{overlay:ovOf(i),end:ovOf(i+1),hold:600}); i++; busy=false; ui(); };
  $('[data-fwd]',host).onclick=fwd;
  $('[data-prev]',host).onclick=()=>jump(i-1);
  $$('.stepbtn',host).forEach(b=>b.onclick=()=>{ if(!busy) jump(+b.dataset.i); });
  $('[data-all]',host).onclick=async()=>{ if(busy){ stop=true; return; } stop=false; if(i===4) jump(0); await sleep(500);
    while(i<4&&!stop){ await fwd(); if(i<4) await sleep(1500); } stop=false; ui(); };
  jump(0);
}
/* ---------- Bilder: Vorlage und Musterlösung ---------- */
function wrapText(t,n=84){ const out=[]; let line=''; t.split(/\s+/).forEach(w=>{ if((line+' '+w).trim().length>n){ out.push(line.trim()); line=w; } else line+=' '+w; }); if(line.trim()) out.push(line.trim()); return out; }
const stripTags=h=>h.replace(/<[^>]+>/g,'');
function mechSheet(m,dir,sol){
  const seq=dir==='h'?[0,1,2,3,4]:[4,3,2,1,0], pal=sol?PRINTC:PRINT, n=MC[m].names, parts=[];
  seq.forEach((k,i)=>{ const ov={arrows:sol&&i<4?resolveArrows(m,mechArrows(i+1,dir)):[], lps:lpsOf(m)};
    const r=mechSVG(m,k,{},pal,ov);
    if(i<4){ const st=stepText(m,dir,i+1), head=stripTags(st.match(/<b>(.*?)<\/b>/)[1]).replace(/:$/,'').replace(/^(\d) /,'Schritt $1 – ');
      parts.push({label:head, text:wrapText(stripTags(st.replace(/<b>.*?<\/b>/,'')).trim())}); }
    else parts.push({label:'Produkte', text:wrapText(dir==='h'?`Es entstehen ${n.L}, ${n.C} und ein Oxonium-Ion. Das Oxonium-Ion wird zurückgebildet: Es wirkt als Katalysator.`:`Es entstehen ${n.D} und ein Oxonium-Ion. Das Oxonium-Ion wird zurückgebildet: Es wirkt als Katalysator.`)});
    parts.push({svg:r.svg,vb:r.vb,w:640,gap:16}); });
  const title=(dir==='h'?'Saure Hydrolyse von ':'Säurekatalysierte Bildung von ')+n.D+(sol?' – Musterlösung':'');
  return sheet(title,parts,700);
}
function imgBox(label,make,fname){
  const box=document.createElement('div'); box.className='vorlagebox';
  box.innerHTML=`<div class="vorlage" role="button" tabindex="0" title="Vergrößern"><img alt="${esc(label)}"></div><div class="row"><button class="btn small" type="button" data-big>⤢ Vergrößern</button><button class="btn small" type="button" data-copy>Bild kopieren</button><a class="btn small" download="${fname}" data-dl>Bild speichern</a><span class="small fbcopy"></span></div>`;
  let framed=false; try{ framed=window.top!==window.self; }catch(e){ framed=true; } if(framed) $('[data-dl]',box).hidden=true;
  const v=make(); let blob=null, url=null;
  svgToPng(v.svg,v.w,v.h,2).then(r=>{ blob=r.blob; url=r.url; $('img',box).src=url; $('[data-dl]',box).href=url; }).catch(()=>{ $('.vorlage',box).innerHTML=v.svg; });
  const big=()=>lightbox(url||'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(v.svg),label);
  $('[data-big]',box).onclick=big; $('.vorlage',box).onclick=big;
  $('[data-copy]',box).onclick=()=>{ const fb=$('.fbcopy',box), no=()=>fb.textContent='Kopieren ist hier nicht möglich. Bild gedrückt halten.';
    try{ if(!blob||!window.ClipboardItem) throw 0; navigator.clipboard.write([new ClipboardItem({'image/png':blob})]).then(()=>fb.textContent='Bild kopiert.').catch(no); }catch(e){ no(); } };
  return box; }
function lightbox(src,label){ const lb=$('#lb'); $('img',lb).src=src; $('img',lb).alt=label; $('.lbt',lb).textContent=label; lb.hidden=false; $('button',lb).focus(); }
/* ---------- Übungsaufgaben ---------- */
function practice(host){
  const draw=()=>{ const t=TASKS[P.task];
    host.innerHTML=`<p class="small">Bearbeite die Aufgabe im Heft: Strukturformeln, freie Elektronenpaare, Ladungen und Elektronenpaarpfeile.</p>
      <div class="row"><button class="btn primary" type="button" data-new>${P.task==null?'Aufgabe stellen':'Neue Aufgabe'}</button></div>
      ${t?`<div class="task"><h3>${t.title}</h3><p>${t.text}</p><p class="small">Die Ausgangsstoffe siehst du in der Formelansicht.</p>
        <div class="row"><button class="btn" type="button" data-sol>Lösung überprüfen</button></div><div class="tout"></div></div>`:''}`;
    linkify(host);
    $('[data-new]',host).onclick=()=>{ let n; do{ n=Math.floor(Math.random()*TASKS.length); }while(TASKS.length>1&&n===P.task); P.task=n; save(); draw(); };
    if(!t){ STAGE.set({k:0}); return; }
    const out=$('.tout',host); STAGE.set({m:t.m,k:t.dir==='h'?0:4},{lps:lpsOf(t.m)});
    $('[data-sol]',host).onclick=e=>{ e.currentTarget.hidden=true; const d=document.createElement('div'); out.appendChild(d); Player(d,t.m,t.dir);
      out.appendChild(imgBox('Musterlösung',()=>mechSheet(t.m,t.dir,true),'Musterloesung.png')); if(window.innerWidth<980) $('#stage').scrollIntoView({behavior:'smooth'}); };
  };
  draw();
}
/* Wenden des Fructose-Bausteins: üblich gezeichnet und gewendet */
function wendenFig(){
  const F=newFrame('-10 90 760 300'); addRing(F,'A',SUG.fruB,pose(170,215),{tint:'B'}); addRing(F,'B',SUG.fruB,pose(560,215,Rz(Math.PI)),{tint:'B'});
  F.hi=['A.C2','B.C2','A.O','B.O'];
  F.caps.push({x:170,y:375,t:'β-D-Fructose, üblich gezeichnet',size:16},{x:560,y:375,t:'gewendet (wie in Saccharose)',size:16});
  const a=`<path d="M318,215 Q365,180 412,215" fill="none" stroke="${PAL.react}" stroke-width="3" marker-end="url(#wfa)"/><text x="365" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="${PAL.react}">um 180° gewendet</text><defs><marker id="wfa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${PAL.react}"/></marker></defs>`;
  return `<svg viewBox="${F.vb}" role="img" aria-label="Fructose-Baustein üblich gezeichnet und gewendet" font-family="var(--font)">${renderFrame(F,PAL,{mid:'wf',ud:false,num:true})}${a}</svg>`; }

/* ================= Start ================= */
readPal(); SET.ud=false; SET.num=true;
STAGE=Stage($('#stage'));
buildGlossar();
renderCard(Math.min(P.cur,CARDS.length-1));
// Glossar als eigene Seite
let backY=0, glossOpen=false;
function openGloss(id){ if(!glossOpen){ backY=window.scrollY; } glossOpen=true; $('#app').hidden=true; $('#prog').hidden=true; $('#gloss').hidden=false; $('#gbtn').setAttribute('aria-pressed','true');
  const tg=id&&document.getElementById(id); if(tg){ tg.scrollIntoView({block:'start'}); tg.classList.remove('flash'); void tg.offsetWidth; tg.classList.add('flash'); } else window.scrollTo(0,0); }
function closeGloss(){ glossOpen=false; $('#gloss').hidden=true; $('#app').hidden=false; $('#prog').hidden=false; $('#gbtn').setAttribute('aria-pressed','false'); STAGE.redraw(); window.scrollTo(0,backY); }
document.addEventListener('click',e=>{ const a=e.target.closest&&e.target.closest('a.gl, a.gi'); if(!a) return; e.preventDefault(); openGloss(a.getAttribute('href').slice(1)); });
$('#gbtn').onclick=()=>glossOpen?closeGloss():openGloss(null);
$('#gback').onclick=closeGloss;
$('#lb button').onclick=()=>{ $('#lb').hidden=true; };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('#lb').hidden=true; });
// Farbschema
function refreshAll(){ readPal(); STAGE.redraw(); buildGlossar(); }
const mq=window.matchMedia('(prefers-color-scheme: dark)'); mq.addEventListener&&mq.addEventListener('change',refreshAll);
new MutationObserver(refreshAll).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
</script>

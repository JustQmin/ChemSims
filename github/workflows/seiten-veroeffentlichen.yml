# Veröffentlicht das Repository auf GitHub Pages und erzeugt dabei automatisch
# die Datei seiten.json mit allen HTML-Seiten. Die Startseite (index.html) liest diese Liste.
name: Seiten veröffentlichen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Dateien holen
        uses: actions/checkout@v4

      - name: Liste der Seiten erzeugen (seiten.json)
        run: |
          find . -maxdepth 1 -type f -name '*.html' ! -name 'index.html' ! -name '404.html' -printf '%f\n' \
            | sort | jq -R . | jq -s . > seiten.json
          echo "Gefundene Seiten:"
          cat seiten.json

      - name: Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Dateien hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
